<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #e8b86d;
    --rose: #e8748a;
    --cream: #fdf6ee;
    --deep: #1a1018;
    --mauve: #8b5e7a;
  }

  html, body {
    height: 100%;
    background: var(--deep);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  canvas#confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .scene {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-align: center;
    padding: 2rem;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 { width: 400px; height: 400px; background: var(--rose); top: -100px; left: -100px; animation: drift1 8s ease-in-out infinite alternate; }
  .orb-2 { width: 350px; height: 350px; background: var(--gold); bottom: -80px; right: -80px; animation: drift2 10s ease-in-out infinite alternate; }
  .orb-3 { width: 300px; height: 300px; background: var(--mauve); top: 40%; left: 50%; transform: translate(-50%, -50%); animation: drift3 12s ease-in-out infinite alternate; }

  @keyframes drift1 { to { transform: translate(40px, 30px); } }
  @keyframes drift2 { to { transform: translate(-30px, -40px); } }
  @keyframes drift3 { to { transform: translate(-50%, -60%); opacity: 0.15; } }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: rise 0.8s ease forwards 0.3s;
    margin-bottom: 1rem;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 8rem);
    font-weight: 700;
    line-height: 1;
    color: var(--cream);
    opacity: 0;
    animation: rise 1s ease forwards 0.6s;
    position: relative;
  }
  .headline em {
    font-style: italic;
    color: var(--gold);
  }

  .subtitle {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 3vw, 1.35rem);
    font-weight: 300;
    color: rgba(253,246,238,0.6);
    opacity: 0;
    animation: rise 1s ease forwards 1s;
    letter-spacing: 0.02em;
  }

  .divider {
    margin-top: 2rem;
    width: 60px; height: 1px;
    background: var(--gold);
    opacity: 0;
    animation: widen 1s ease forwards 1.4s;
  }

  .wish {
    margin-top: 1.5rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    color: rgba(253,246,238,0.5);
    opacity: 0;
    animation: rise 1s ease forwards 1.7s;
    max-width: 420px;
  }

  .candles {
    margin-top: 2.5rem;
    display: flex;
    gap: 18px;
    align-items: flex-end;
    opacity: 0;
    animation: rise 1s ease forwards 2s;
  }
  .candle {
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .flame {
    width: 10px; height: 18px;
    background: radial-gradient(ellipse at 50% 80%, #fff8e1, var(--gold) 50%, var(--rose));
    border-radius: 50% 50% 30% 30%;
    animation: flicker 1.2s ease-in-out infinite alternate;
    position: relative;
  }
  .flame::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px;
    background: var(--gold);
    border-radius: 50%;
    filter: blur(2px);
  }
  .stick {
    width: 8px;
    border-radius: 3px;
    background: linear-gradient(to bottom, #f0d5b0, #c8a878);
  }
  .c1 .stick { height: 36px; }
  .c2 .stick { height: 50px; }
  .c3 .stick { height: 42px; }
  .c4 .stick { height: 30px; }
  .c5 .stick { height: 46px; }

  @keyframes flicker {
    0%   { transform: scaleX(1)   scaleY(1)   rotate(-1deg); opacity: 1; }
    33%  { transform: scaleX(0.9) scaleY(1.1) rotate(1deg);  opacity: 0.9; }
    66%  { transform: scaleX(1.1) scaleY(0.95) rotate(-0.5deg); opacity: 1; }
    100% { transform: scaleX(0.95) scaleY(1.05) rotate(1.5deg); opacity: 0.95; }
  }
  .c1 .flame { animation-delay: 0s; }
  .c2 .flame { animation-delay: 0.2s; }
  .c3 .flame { animation-delay: 0.4s; }
  .c4 .flame { animation-delay: 0.1s; }
  .c5 .flame { animation-delay: 0.3s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes widen {
    from { opacity: 0; width: 0; }
    to   { opacity: 1; width: 60px; }
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="scene">
  <p class="eyebrow">Today is your day</p>
  <h1 class="headline">Happy<br><em>Birthday</em></h1>
  <p class="subtitle">Wishing you a day as wonderful as you are</p>
  <div class="divider"></div>
  <p class="wish">"May every candle carry a wish, and every wish find its way to you."</p>
  <div class="candles">
    <div class="candle c1"><div class="flame"></div><div class="stick"></div></div>
    <div class="candle c2"><div class="flame"></div><div class="stick"></div></div>
    <div class="candle c3"><div class="flame"></div><div class="stick"></div></div>
    <div class="candle c4"><div class="flame"></div><div class="stick"></div></div>
    <div class="candle c5"><div class="flame"></div><div class="stick"></div></div>
  </div>
</div>

<script>
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

const COLORS = ['#e8b86d','#e8748a','#c9a0dc','#8be8c9','#fdf6ee','#f4a261'];
const pieces = [];

function Piece() {
  this.x = Math.random() * canvas.width;
  this.y = -20;
  this.r = Math.random() * 6 + 3;
  this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
  this.vx = (Math.random() - 0.5) * 2;
  this.vy = Math.random() * 2 + 1;
  this.angle = Math.random() * Math.PI * 2;
  this.spin = (Math.random() - 0.5) * 0.15;
  this.shape = Math.random() < 0.5 ? 'rect' : 'circle';
  this.w = this.r * 2;
  this.h = this.r * 0.6;
  this.opacity = Math.random() * 0.5 + 0.5;
}

for (let i = 0; i < 120; i++) {
  const p = new Piece();
  p.y = Math.random() * canvas.height;
  pieces.push(p);
}

function spawnBurst() {
  for (let i = 0; i < 6; i++) pieces.push(new Piece());
}
setInterval(spawnBurst, 300);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    p.x += p.vx;
    p.y += p.vy;
    p.angle += p.spin;
    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    ctx.restore();
    if (p.y > canvas.height + 20) pieces.splice(i, 1);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
